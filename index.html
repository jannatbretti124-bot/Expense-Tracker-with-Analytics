<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker with Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Expense Tracker with Analytics</h1>
    </header>
    <main>
        <section id="expense-form">
            <h2>Add Expense</h2>
            <form id="add-expense">
                <label for="description">Description:</label>
                <input type="text" id="description" required>
                <label for="amount">Amount:</label>
                <input type="number" id="amount" required>
                <button type="submit">Add Expense</button>
            </form>
        </section>
        <section id="expense-table">
            <h2>Expenses</h2>
            <table>
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="expense-list">
                    <!-- Expense items will be dynamically inserted here -->
                </tbody>
            </table>
        </section>
        <section id="dashboard">
            <h2>Analytics Dashboard</h2>
            <div id="total-expense">
                <h3>Total Expense: $<span id="total-amount">0.00</span></h3>
            </div>
            <div id="categories">
                <h3>Expense Categories</h3>
                <ul id="category-list">
                    <!-- Categories will be dynamically listed here -->
                </ul>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
